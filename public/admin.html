<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>塔界远征 · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css?v=20260911a">
<link rel="stylesheet" href="/css/admin.css?v=20260909f">
</head>
<body>

<!-- 管理员登录 -->
<div id="ad-login-view" class="view login-view">
    <div class="login-card">
        <h1 class="game-title">管理后台</h1>
        <p class="subtitle">塔界远征 · 运营控制台</p>
        <input id="ad-u" placeholder="管理员账号" value="admin" autocomplete="username">
        <input id="ad-p" type="password" placeholder="管理员密码" autocomplete="current-password">
        <button id="ad-go">登 录</button>
        <p class="hint">此入口仅供运营人员使用，玩家端无任何入口指向此处。</p>
        <p class="hint" style="margin-top:10px"><a href="/" style="color:#5cc7ff">← 返回游戏</a></p>
    </div>
</div>

<!-- 后台主体 -->
<div id="ad-main" class="hidden admin-shell">
    <div class="admin-topbar">
        <div class="admin-brand">⚙ 塔界远征 · 管理后台</div>
        <div class="admin-top-actions">
            <span id="ad-who" style="font-size:12px;color:#b9b3d8"></span>
            <a href="/" class="btn small ghost" style="line-height:1.6">返回游戏</a>
            <button class="btn small ghost" id="ad-logout">退出</button>
        </div>
    </div>
    <div class="admin-body-wrap">
        <div class="admin-tabs">
            <button data-t="overview" class="active">概览</button>
            <button data-t="hero">英雄管理</button>
            <button data-t="wall">城墙管理</button>
            <button data-t="event">活动管理</button>
            <button data-t="users">玩家列表</button>
            <button data-t="sms">验证码</button>
            <button data-t="gift">礼品码</button>
            <button data-t="order">小游戏排序</button>
            <button data-t="roms">模拟器ROM</button>
        </div>
        <div id="admin-body">加载中...</div>
    </div>
</div>

<div id="modal-root"></div>

<script src="/js/utils.js?v=20260909f"></script>
<script src="/js/admin-app.js?v=20260911a"></script>
</body>
</html>
