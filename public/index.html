<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%94%3C/text%3E%3C/svg%3E">

<!-- 登录 -->
<!--
  登录 / 注册合并为一个面板：上方 tab 显示当前模式，右侧 "切换" 链接一键互切。
  初始为登录；点 "没有账号？点此注册" 切到注册（多一个昵称输入框，密码要求 ≥4 位）。
  短信通道（手机号 + 验证码）已下线（2026-09-09）：真实短信需付费厂商，恢复时取消下方注释。
-->
<div id="login-view" class="view login-view">
    <div class="login-card">
        <div class="login-header">
            <h1 class="game-title" id="login-title">登 录</h1>
            <a class="login-switch" id="login-switch" href="javascript:void(0)">没有账号？点此注册</a>
        </div>
        <p class="subtitle">肉鸽推塔 · 部落远征</p>
        <!-- 注册时显示，登录时隐藏 -->
        <input id="login-nickname" class="hidden" placeholder="昵称（2-12 个字符，不填则随机生成）">
        <!-- 账号通道 -->
        <div id="login-account-box">
            <input id="login-username" placeholder="账号（4-16 位字母/数字）">
            <input id="login-password" type="password" placeholder="密码（4 位以上）">
            <label class="login-remember"><input type="checkbox" id="login-remember"> 记住我（30 天内免登录）</label>
            <button id="btn-login">登 录</button>
            <p class="hint" id="login-hint">账号注册：4-16 位英文字母+数字，密码至少 4 位。</p>
        </div>
        <!-- 手机号通道（短信服务商未接入，暂时下线）
        <div class="login-tabs">
            <button id="tab-account" class="active">账 号</button>
            <button id="tab-phone">手机号</button>
        </div>
        <div id="login-phone-box" class="hidden">
            <input id="login-phone" placeholder="手机号" maxlength="11" inputmode="numeric">
            <div class="sms-row">
                <input id="login-sms" placeholder="验证码" maxlength="6" inputmode="numeric">
                <button id="btn-send-sms" class="ghost" type="button">获取验证码</button>
            </div>
            <input id="login-phone-pw" type="password" placeholder="设置密码（首次注册选填，4 位以上）">
            <button id="btn-phone-login">验证码登录 / 注册</button>
            <p class="hint" style="margin-top:6px">未注册的手机号将自动创建账号，一个手机号只有一个账号。</p>
        </div>
        -->
    </div>
</div>

<!-- 主界面 -->
<div id="app-view" class="hidden">
<!-- 顶部资源栏 -->
<div class="topbar">
    <!-- 玩家头像：左下角（battle 时隐藏） -->
    <button id="btn-avatar" class="avatar-btn" title="个人信息">
        <span class="avatar" id="player-avatar" data-empty="true"></span>
    </button>
    <div class="resources">
        <span class="r gem" title="钻石">💎 <b id="r-gem">0</b></span>
        <span class="r gold" title="金币">💰 <b id="r-gold">0</b></span>
        <span class="r wood" title="木材"><i class="ric" data-res-icon="wood"></i> <b id="r-wood">0</b></span>
        <span class="r iron" title="铁矿"><i class="ric" data-res-icon="iron"></i> <b id="r-iron">0</b></span>
        <span class="r stone" title="石币"><i class="ric" data-res-icon="stone"></i> <b id="r-stone">0</b></span>
        <span class="r exp" title="经验"><i class="ric" data-res-icon="exp"></i> <b id="r-exp">0</b></span>
        <span class="r wish" title="许愿卡">🎴 <b id="r-wish">0</b></span>
    </div>
    <div class="top-actions">
        <button id="btn-profile" class="profile-chip" title="点击修改昵称">
            <span id="p-nick">冒险者</span><span id="p-uid" class="uid"></span>
        </button>
        <button id="btn-chat" title="聊天">💬</button>
        <button id="btn-event" title="活动">🎉<i id="event-dot" class="dot hidden"></i></button>
        <button id="btn-mail" title="邮件">📧<i id="mail-dot" class="dot hidden"></i></button>
        <button id="btn-menu" title="菜单">⋮</button>
    </div>
</div>

    <!-- 菜单 -->
    <div id="menu-panel" class="panel hidden">
        <div class="menu-list">
            <div data-action="profile">👤 个人资料</div>
            <div data-action="settings">⚙ 设置</div>
            <div data-action="free">🎁 每日免费领取</div>
            <div data-action="event">🎉 活动中心</div>
            <div data-action="logout">🚪 退出登录</div>
        </div>
    </div>

    <!-- 主体内容区 -->
    <div id="page-content" class="page-content"></div>

    <!-- 底部导航 -->
    <div class="bottomnav">
        <button data-tab="camp" class="active"><span>🏕</span><br>营地</button>
        <button data-tab="aid"><span>🛡</span><br>助战</button>
        <button data-tab="hero"><span>🦸</span><br>英雄</button>
        <button data-tab="tower"><span>⚔️</span><br>冒险</button>
        <button data-tab="world"><span>🌍</span><br>世界</button>
        <button data-tab="clan"><span>🏰</span><br>部落</button>
        <button data-tab="ancient"><span>🌌</span><br>远古世界</button>
    </div>
</div>
