<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Cadet Pinball</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; touch-action: none; }
        body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #stage { position: absolute; inset: 0; overflow: hidden; }
        canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; max-width: none; max-height: none; background: #000; outline: none; image-rendering: auto; }
        #status { position: absolute; z-index: 20; top: calc(50% - 34px); left: 50%; transform: translateX(-50%); color: #d9e7ff; font: 14px Arial, sans-serif; white-space: nowrap; }
        #progress { position: absolute; z-index: 20; top: calc(50% + 24px); left: 50%; transform: translateX(-50%); width: min(260px, 70%); }
        #touch-controls { display: none; position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .touch-key { position: absolute; border: 0; border-radius: 0; padding: 0; margin: 0; background: transparent; color: transparent; opacity: 0; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-appearance: none; }
        #touch-left { left: 0; top: 0; width: 50%; height: 100%; }
        #touch-right { left: 50%; top: 0; width: 50%; height: 100%; }
        #touch-launch { right: 0; top: 14%; width: 16%; height: 42%; z-index: 3; }
        #touch-hint { position: absolute; right: 1%; top: 43%; width: 18%; padding: 4px 0; border: 1px solid rgba(255,235,170,.42); border-radius: 5px; background: rgba(10,15,28,.48); color: rgba(255,235,170,.92); font: 700 11px/1.35 Arial, sans-serif; letter-spacing: .3px; text-align: center; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 4; }
        @media (pointer: coarse), (max-width: 600px) {
            canvas { left: 50%; top: 50%; right: auto; bottom: auto; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); transform: translate(-50%, -50%) translateZ(0); image-rendering: pixelated; }
            #touch-controls { display: block; }
        }
    </style>
</head>
<body>
    <main id="stage">
        <div id="status">Loading Space Cadet...</div>
        <progress id="progress" value="5" max="100"></progress>
        <canvas id="canvas" tabindex="0" aria-label="Space Cadet Pinball"></canvas>
        <div id="touch-controls" aria-label="Pinball touch controls">
            <div id="touch-left" class="touch-key" role="button" aria-label="Left flipper"></div>
            <div id="touch-right" class="touch-key" role="button" aria-label="Right flipper"></div>
            <div id="touch-launch" class="touch-key" role="button" aria-label="Launch ball"></div>
            <div id="touch-hint">长按蓄力<br>松开发射</div>
        </div>
    </main>
    <script>
        const statusElement = document.getElementById('status');
        const progressElement = document.getElementById('progress');
        const canvas = document.getElementById('canvas');
        const gameKeys = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space']);

        window.addEventListener('keydown', event => {
            if (gameKeys.has(event.code)) event.preventDefault();
        }, { capture: true });
        window.addEventListener('keyup', event => {
            if (gameKeys.has(event.code)) event.preventDefault();
        }, { capture: true });
        window.addEventListener('keydown', event => {
            if (event.code === 'F8') event.preventDefault();
        }, { capture: true });
        ['contextmenu', 'selectstart', 'dragstart', 'gesturestart'].forEach(type => {
            document.addEventListener(type, event => event.preventDefault(), { capture: true });
        });
        window.addEventListener('pointerdown', () => canvas.focus());

        const touchKeys = {
            'touch-left': ['_spacecadet_left_down', '_spacecadet_left_up'],
            'touch-right': ['_spacecadet_right_down', '_spacecadet_right_up'],
            'touch-launch': ['_spacecadet_launch_down', '_spacecadet_launch_up'],
        };
        Object.keys(touchKeys).forEach(id => {
            const button = document.getElementById(id);
            const functions = touchKeys[id];
            let pressed = false;
            const send = (type, event) => {
                event.preventDefault();
                if (type === 'keydown' && pressed) return;
                if (type === 'keyup' && !pressed) return;
                pressed = type === 'keydown';
                canvas.focus();
                button.classList.toggle('pressed', type === 'keydown');
                const fn = Module[functions[type === 'keydown' ? 0 : 1]];
                if (typeof fn === 'function') fn();
            };
            button.addEventListener('pointerdown', event => {
                button.setPointerCapture(event.pointerId);
                send('keydown', event);
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
                button.addEventListener(type, event => send('keyup', event));
            });
            button.addEventListener('touchstart', event => {
                event.preventDefault();
                send('keydown', event);
            }, { passive: false });
            button.addEventListener('touchend', event => {
                event.preventDefault();
                send('keyup', event);
            }, { passive: false });
            button.addEventListener('touchcancel', event => {
                event.preventDefault();
                send('keyup', event);
            }, { passive: false });
        });

        const activeTouchPointers = new Map();
        function dispatchTouchKey(id, type) {
            const functions = touchKeys[id];
            const fn = Module[functions[type === 'keydown' ? 0 : 1]];
            if (typeof fn === 'function') fn();
        }
        function getTouchKey(event) {
            const rect = document.getElementById('stage').getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;
            if (x >= 0.84 && y >= 0.14 && y <= 0.56) return 'touch-launch';
            if (y < 0.7) return null;
            if (x < 0.34) return 'touch-left';
            if (x >= 0.66) return 'touch-right';
            return null;
        }
        document.getElementById('stage').addEventListener('pointerdown', event => {
            if (event.pointerType === 'mouse') return;
            const id = getTouchKey(event);
            if (!id || activeTouchPointers.has(event.pointerId)) return;
            activeTouchPointers.set(event.pointerId, id);
            canvas.focus();
            dispatchTouchKey(id, 'keydown');
        }, true);
        ['pointerup', 'pointercancel'].forEach(type => {
            window.addEventListener(type, event => {
                const id = activeTouchPointers.get(event.pointerId);
                if (!id) return;
                activeTouchPointers.delete(event.pointerId);
                dispatchTouchKey(id, 'keyup');
            }, true);
        });

        function prepareOfflineHighScores() {
            try {
                const path = '/home/web_user/.local/share/SpaceCadetPinball/imgui_pb.ini';
                const directory = '/home/web_user/.local/share/SpaceCadetPinball';
                Module.FS_createPath('/home', 'web_user', true, true);
                Module.FS_createPath('/home/web_user', '.local', true, true);
                Module.FS_createPath('/home/web_user/.local', 'share', true, true);
                Module.FS_createPath('/home/web_user/.local/share', 'SpaceCadetPinball', true, true);
                try {
                    Module.FS_unlink(path);
                } catch (error) {
                    if (error && error.errno !== 44) throw error;
                }
                const scores = Array.from({ length: 5 }, (_, index) => `${index}.Score=2147483647`);
                Module.FS_createDataFile(directory, 'imgui_pb.ini', new TextEncoder().encode([
                    '[Pinball][Settings]', ...scores, '',
                ].join('\n')), true, true);
            } catch (error) {
                console.warn('Offline high-score storage is unavailable', error && error.errno, error && error.message);
            }
        }

        let nativeSurfaceLocked = false;
        function lockNativeSurface() {
            if (nativeSurfaceLocked) return;
            nativeSurfaceLocked = true;
            canvas.style.left = '0';
            canvas.style.top = '0';
            canvas.style.right = 'auto';
            canvas.style.bottom = 'auto';
            canvas.style.transform = 'none';
            canvas.style.width = '640px';
            canvas.style.height = '480px';
            window.dispatchEvent(new Event('resize'));
            window.setTimeout(() => {
                ['left', 'top', 'right', 'bottom', 'transform', 'width', 'height'].forEach(property => {
                    canvas.style.removeProperty(property);
                });
            }, 0);
        }

        const loadingStartedAt = performance.now();
        let runtimeReady = false;
        var Module = {
            canvas,
            preRun: [prepareOfflineHighScores],
            locateFile: path => `${path}?v=14`,
            print: text => console.log(text),
            printErr: text => console.error(text),
            onRuntimeInitialized() {
                runtimeReady = true;
                window.setTimeout(lockNativeSurface, 0);
                const remaining = Math.max(0, 800 - (performance.now() - loadingStartedAt));
                window.setTimeout(() => {
                    statusElement.hidden = true;
                    progressElement.hidden = true;
                }, remaining);
                window.setInterval(() => {
                    if (typeof Module._spacecadet_get_score !== 'function') return;
                    window.parent.postMessage({
                        type: 'spacecadet-score',
                        score: Module._spacecadet_get_score(),
                        balls: typeof Module._spacecadet_get_ball_count === 'function'
                            ? Module._spacecadet_get_ball_count()
                            : 0,
                    }, window.location.origin);
                }, 250);
            },
            setStatus(text) {
                const match = text && text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
                if (match) {
                    statusElement.textContent = match[1].trim();
                    progressElement.hidden = false;
                    progressElement.value = Number(match[2]);
                    progressElement.max = Number(match[3]);
                } else {
                    statusElement.textContent = text || '';
                    if (runtimeReady) {
                        statusElement.hidden = !text;
                        progressElement.hidden = true;
                    } else {
                        statusElement.hidden = false;
                        progressElement.hidden = false;
                    }
                }
            },
            monitorRunDependencies(left) {
                Module.setStatus(left ? `Preparing... (${left})` : '');
            },
        };
    </script>
    <script async src="SpaceCadetPinball.js?v=14"></script>
</body>
</html>
