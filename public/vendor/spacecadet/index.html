<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Cadet Pinball</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; touch-action: none; }
        body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
        canvas { display: block; width: 100%; height: 100%; max-width: none; max-height: none; background: #000; outline: none; }
        #status { position: absolute; color: #d9e7ff; font: 14px Arial, sans-serif; }
        #progress { position: absolute; top: calc(50% + 24px); width: min(260px, 70%); }
        #touch-controls { display: none; position: absolute; inset: 0; pointer-events: none; }
        .touch-key { position: absolute; border: 0; border-radius: 0; padding: 0; margin: 0; background: transparent; color: transparent; opacity: 0; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #touch-left { left: 0; bottom: 0; width: 32%; height: 31%; }
        #touch-right { right: 0; bottom: 0; width: 32%; height: 31%; }
        #touch-launch { right: 0; top: 28%; width: 13%; height: 47%; }
        #touch-hint { position: absolute; right: 1.5%; top: 47%; width: 10%; color: rgba(255,235,170,.86); font: 700 11px/1.35 Arial, sans-serif; letter-spacing: .3px; text-align: center; pointer-events: none; text-shadow: 0 1px 3px #000; }
        @media (pointer: coarse), (max-width: 600px) {
            #touch-controls { display: block; }
        }
    </style>
</head>
<body>
    <main id="stage">
        <div id="status">Loading Space Cadet...</div>
        <progress id="progress" value="0" max="100"></progress>
        <canvas id="canvas" tabindex="0" aria-label="Space Cadet Pinball"></canvas>
        <div id="touch-controls" aria-label="Pinball touch controls">
            <button id="touch-left" class="touch-key" type="button" aria-label="Left flipper"></button>
            <button id="touch-right" class="touch-key" type="button" aria-label="Right flipper"></button>
            <button id="touch-launch" class="touch-key" type="button" aria-label="Launch ball"></button>
            <div id="touch-hint">HOLD<br>RELEASE</div>
        </div>
    </main>
    <script>
        const statusElement = document.getElementById('status');
        const progressElement = document.getElementById('progress');
        const canvas = document.getElementById('canvas');
        const gameKeys = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space']);

        window.addEventListener('keydown', event => {
            if (gameKeys.has(event.code)) event.preventDefault();
        }, { capture: true });
        window.addEventListener('keyup', event => {
            if (gameKeys.has(event.code)) event.preventDefault();
        }, { capture: true });
        ['contextmenu', 'selectstart', 'dragstart', 'gesturestart'].forEach(type => {
            document.addEventListener(type, event => event.preventDefault(), { capture: true });
        });
        window.addEventListener('pointerdown', () => canvas.focus());

        const touchKeys = {
            'touch-left': ['_spacecadet_left_down', '_spacecadet_left_up'],
            'touch-right': ['_spacecadet_right_down', '_spacecadet_right_up'],
            'touch-launch': ['_spacecadet_launch_down', '_spacecadet_launch_up'],
        };
        Object.keys(touchKeys).forEach(id => {
            const button = document.getElementById(id);
            const functions = touchKeys[id];
            const send = (type, event) => {
                event.preventDefault();
                canvas.focus();
                button.classList.toggle('pressed', type === 'keydown');
                const fn = Module[functions[type === 'keydown' ? 0 : 1]];
                if (typeof fn === 'function') fn();
            };
            button.addEventListener('pointerdown', event => {
                button.setPointerCapture(event.pointerId);
                send('keydown', event);
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
                button.addEventListener(type, event => send('keyup', event));
            });
        });

        var Module = {
            canvas,
            locateFile: path => `${path}?v=6`,
            print: text => console.log(text),
            printErr: text => console.error(text),
            onRuntimeInitialized() {
                window.setInterval(() => {
                    if (typeof Module._spacecadet_get_score !== 'function') return;
                    window.parent.postMessage({
                        type: 'spacecadet-score',
                        score: Module._spacecadet_get_score(),
                        balls: typeof Module._spacecadet_get_ball_count === 'function'
                            ? Module._spacecadet_get_ball_count()
                            : 0,
                    }, window.location.origin);
                }, 250);
            },
            setStatus(text) {
                const match = text && text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
                if (match) {
                    statusElement.textContent = match[1].trim();
                    progressElement.hidden = false;
                    progressElement.value = Number(match[2]);
                    progressElement.max = Number(match[3]);
                } else {
                    statusElement.textContent = text || '';
                    statusElement.hidden = !text;
                    progressElement.hidden = true;
                }
            },
            monitorRunDependencies(left) {
                Module.setStatus(left ? `Preparing... (${left})` : '');
            },
        };
    </script>
    <script async src="SpaceCadetPinball.js?v=6"></script>
</body>
</html>
