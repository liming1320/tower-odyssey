# 塔界远征 · Nginx 反向代理配置
# 宝塔面板用法：站点 → 设置 → 配置文件，把下面 server{} 整段替换进去
#   改两处：server_name 填你的域名；proxy_pass 端口与 systemd 里的 PORT 一致（默认 5180）
# 纯 Linux 用法：复制到 /etc/nginx/conf.d/tower-odyssey.conf 后 nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name  game.example.com;          # ← 改成你的域名

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # 健康检查（不记日志，给监控/负载均衡探活）
    location = /api/health {
        proxy_pass http://127.0.0.1:5180;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 自动部署钩子（Gitee push → 自动 git pull + 重启）
    #
    # 为什么走这里而不是直接暴露 9000：
    #   腾讯云安全组默认只放行 80/443，单独放行 9000 要额外配置，且容易被扫。
    #   挂到已有的 80 端口下，零新增端口，Gitee 里填
    #     http://你的域名/__deploy
    #   即可（webhook 服务只监听 127.0.0.1:9000，外网摸不到）。
    #
    # 前置：先跑 bash deploy/linux/install-webhook.sh 把 webhook 服务装上。
    # 建议把 __deploy 改成一串随机串（如 /__deploy-7f3a9c），降低被扫到的概率。
    # ------------------------------------------------------------------
    location = /__deploy {
        proxy_pass http://127.0.0.1:9000/hook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 部署脚本要拉代码+重启，给足超时；webhook 是 202 立即返回，不会真等这么久
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 静态资源：SVG / JS / CSS 缓存 7 天（改版后记得改 index.html 里的 ?v= 版本号）
    location ~* \.(svg|js|css|png|jpg|jpeg|gif|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:5180;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 全部请求转发给 Node（含 API 与页面）
    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 预留 WebSocket / SSE（后续做实时聊天、推送用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    access_log /var/log/nginx/tower-odyssey.access.log;
    error_log  /var/log/nginx/tower-odyssey.error.log;
}

# HTTPS（宝塔「SSL → Let's Encrypt」申请后会自动生成 443 的 server 块，
# 内容同上，只是多了 ssl_certificate 两行 + listen 443 ssl http2;）
# 纯手动的话用：certbot --nginx -d game.example.com
